name: 商业授权咨询
description: 说明使用场景并咨询适用的商业许可
title: "[Commercial license] "
labels: [commercial-license]
body:
  - type: markdown
    attributes:
      value: 此 Issue 的内容会公开显示。请简要说明使用场景，不要填写预算、客户名称、未公开代码等不宜公开的信息。维护者确认后会告知后续沟通方式。
  - type: dropdown
    id: use
    attributes:
      label: 使用类型
      options:
        - 专有产品嵌入
        - 闭源内部部署
        - 托管服务
        - 商业支持
        - 其他
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 使用场景与需求
      description: 请说明计划如何使用或分发 Rillshot，以及希望获得哪类授权或支持。
    validations:
      required: true
