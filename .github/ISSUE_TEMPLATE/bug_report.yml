name: 缺陷报告
description: 提交可复现的功能、稳定性或界面问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 上传附件前，请删除账号、工作内容、本地路径等不宜公开的信息。安全漏洞不要在此提交，请按 SECURITY.md 从仓库的 Security 页面报告。
  - type: input
    id: version
    attributes:
      label: Rillshot 版本
      placeholder: 1.1.9
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: Windows 版本、缩放、显示器布局、捕获后端与输入方式。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 实际结果与预期结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志与截图（可选）
      description: 可上传有助于定位问题的日志、JSONL、对照图或录屏。上传前请删除与问题无关的个人信息、工作内容和本地路径。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue。
          required: true
        - label: 我已检查附件，其中不包含不宜公开的信息。
          required: true
