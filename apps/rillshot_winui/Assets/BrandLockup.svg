<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-labelledby="title description">
  <title id="title">Rillshot working-brand lockup</title>
  <desc id="description">A name-neutral seamless capture symbol beside the current Rillshot working wordmark.</desc>
  <defs>
    <linearGradient id="surface" x1="86" y1="62" x2="426" y2="454" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173F5F"/>
      <stop offset="1" stop-color="#071822"/>
    </linearGradient>
    <linearGradient id="upperContent" x1="206" y1="112" x2="302" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4FEFF"/>
      <stop offset="1" stop-color="#C7F6F4"/>
    </linearGradient>
    <linearGradient id="lowerContent" x1="206" y1="246" x2="306" y2="396" gradientUnits="userSpaceOnUse">
      <stop stop-color="#72E8DC"/>
      <stop offset="1" stop-color="#42CDBF"/>
    </linearGradient>
    <linearGradient id="edge" x1="118" y1="84" x2="402" y2="432" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8CCBFF" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#43D5C6" stop-opacity="0.08"/>
    </linearGradient>
    <clipPath id="contentClip"><rect x="184" y="112" width="144" height="284" rx="40"/></clipPath>
  </defs>

  <svg x="34" y="34" width="232" height="232" viewBox="0 0 512 512">
    <rect x="44" y="44" width="424" height="424" rx="118" fill="url(#surface)"/>
    <rect x="45" y="45" width="422" height="422" rx="117" fill="none" stroke="url(#edge)" stroke-width="2"/>
    <g id="seamColumn" clip-path="url(#contentClip)">
      <path d="M184 112H328V232L184 278Z" fill="url(#upperContent)"/>
      <path d="M184 291L328 245V396H184Z" fill="url(#lowerContent)"/>
    </g>
    <rect x="185.5" y="113.5" width="141" height="281" rx="38.5" fill="none" stroke="#E7FFFF" stroke-opacity="0.18" stroke-width="3"/>
    <path d="M198 148H148V198M314 364H364V314" fill="none" stroke="#F4FEFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <text x="302" y="141" fill="#112231" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="650" letter-spacing="-2">Rillshot</text>
  <text x="306" y="181" fill="#587080" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="450" letter-spacing="1.2">SEAMLESS SCROLL CAPTURE</text>
